<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a24">
<title>Lagos Hustle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9c8d9;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#auth{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(150deg,rgba(7,17,28,.84),rgba(7,17,28,.48)),linear-gradient(35deg,#273d36,#1b3046);overflow:auto}
.panel{width:min(100%,390px);padding:26px 22px;border:1px solid #ffffff24;border-radius:24px;background:#111d2af2;box-shadow:0 22px 70px #0008}
.logo{font-size:29px;font-weight:900;letter-spacing:-1px}.logo span{color:#52e0a0}
.sub{color:#b8c7d4;font-size:13px;line-height:1.5;margin:8px 0 22px}
.tabs{display:flex;padding:4px;background:#08121d;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;border:0;border-radius:9px;padding:12px;color:#aab8c6;background:transparent;font-weight:bold}
.tabs button.active{background:#26394a;color:white}
.field{margin:12px 0}.field label{display:block;font-size:12px;color:#c2d0dc;margin-bottom:7px}
.field input{width:100%;border:1px solid #344757;border-radius:11px;background:#091521;color:white;padding:14px;font-size:15px;outline:none}
.field input:focus{border-color:#52e0a0}
.primary{width:100%;border:0;border-radius:12px;padding:15px;background:#52e0a0;color:#092018;font-weight:900;font-size:15px;margin-top:10px}
#authMsg{font-size:12px;color:#ffb6a9;line-height:1.4;margin-top:12px;min-height:16px}
.small{font-size:11px;color:#8799aa;text-align:center;line-height:1.5;margin-top:12px}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
.glass{background:#101c2bdb;border:1px solid #ffffff20;backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 5px 20px #0002}
#topbar{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#brand{font-size:15px;font-weight:900}#brand span{color:#52e0a0}
#stats{font-size:11px;color:#d2dde7;margin-top:5px}
#logout{pointer-events:auto;border:1px solid #ffffff28;background:#ffffff0d;color:white;padding:9px 11px;border-radius:10px;font-size:11px}
#tip{position:absolute;top:90px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:8px 12px;font-size:11px;color:#e6edf3}
#joy{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:22px;width:124px;height:124px;border-radius:50%;background:#101c2b75;border:2px solid #ffffff42;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#d9f6e9e8;border:2px solid white;box-shadow:0 4px 14px #0004}
#look{position:absolute;right:0;top:120px;bottom:0;width:48%;pointer-events:auto;touch-action:pan-y}
#action{position:absolute;right:22px;bottom:calc(35px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;border:2px solid #ffffff9c;background:#52e0a0d9;color:#082019;font-weight:900;pointer-events:auto}
#notice{position:absolute;left:50%;bottom:165px;transform:translateX(-50%);font-size:11px;color:white;background:#101c2bdb;border-radius:10px;padding:10px 14px;white-space:nowrap}
@media(min-width:700px){#joy{width:140px;height:140px}#stick{left:42px;top:42px}#topbar{left:24px;right:24px}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="game"></div>
<div id="auth">
  <div class="panel">
    <div class="logo">LAGOS <span>HUSTLE</span></div>
    <div class="sub">Your city. Your story. Build your hustle, explore the streets, and rise from the bottom.</div>
    <div class="tabs"><button id="loginTab" class="active">LOGIN</button><button id="registerTab">CREATE ACCOUNT</button></div>
    <form id="authForm">
      <div class="field" id="usernameField" hidden><label for="username">PLAYER NAME</label><input id="username" autocomplete="username" minlength="3" maxlength="20" placeholder="e.g. LagosKing"></div>
      <div class="field"><label for="identity">USERNAME OR EMAIL</label><input id="identity" autocomplete="username" required placeholder="Enter username or email"></div>
      <div class="field" id="emailField" hidden><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="At least 10 characters"></div>
      <button class="primary" id="submitBtn" type="submit">ENTER LAGOS</button>
      <div id="authMsg" role="status"></div>
    </form>
    <div class="small">An internet connection is needed to load the 3D game and sign in.</div>
  </div>
</div>
<div id="hud">
  <div id="topbar" class="glass">
    <div><div id="brand">LAGOS <span>HUSTLE</span></div><div id="stats">Loading player...</div></div>
    <button id="logout">LOG OUT</button>
  </div>
  <div id="tip" class="glass">DRAG RIGHT SIDE TO LOOK AROUND</div>
  <div id="look" aria-label="Drag to rotate camera"></div>
  <div id="joy"><div id="stick"></div></div>
  <button id="action">PLAY</button>
  <div id="notice">Welcome to Lagos. Explore the streets!</div>
</div>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const auth=$('auth'),hud=$('hud'),form=$('authForm');
let mode='login',player=null,token=null,scene,camera,renderer,char,camYaw=0;
let joyX=0,joyY=0,draggingJoy=false,lookActive=false,lastLookX=0;
let started=false,clock=new THREE.Clock();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function setMode(next){
 mode=next;
 $('loginTab').classList.toggle('active',mode==='login');
 $('registerTab').classList.toggle('active',mode==='register');
 $('usernameField').hidden=mode!=='register';
 $('emailField').hidden=mode!=='register';
 $('username').required=mode==='register';
 $('email').required=mode==='register';
 $('password').autocomplete=mode==='login'?'current-password':'new-password';
 $('submitBtn').textContent=mode==='login'?'ENTER LAGOS':'CREATE ACCOUNT';
 $('authMsg').textContent='';
}
$('loginTab').onclick=()=>setMode('login');
$('registerTab').onclick=()=>setMode('register');

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=$('submitBtn'),msg=$('authMsg');
 btn.disabled=true;btn.textContent='PLEASE WAIT...';msg.textContent='';
 try{
  const payload=mode==='login'
   ?{identity:$('identity').value.trim(),password:$('password').value}
   :{username:$('username').value.trim(),email:$('email').value.trim(),password:$('password').value};
  const response=await fetch(mode==='login'?'/api/login':'/api/register',{
   method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Could not sign in. Check your details and try again.');
  player=data.player||data.user||null;
  token=data.token||null;
  if(!player)throw new Error('The server did not return player details. Check your worker response.');
  enterGame();
 }catch(err){msg.textContent=err.message||'Connection failed. Please try again.';}
 finally{btn.disabled=false;btn.textContent=mode==='login'?'ENTER LAGOS':'CREATE ACCOUNT';}
});

function enterGame(){
 auth.style.display='none';hud.style.display='block';
 $('stats').textContent=(player.username||'Player')+'  •  ₦'+Number(player.money||0).toLocaleString()+'  •  Level '+(player.level||1);
 if(!started){started=true;init3D();}
 $('notice').textContent='Welcome, '+(player.username||'Player')+'!';
 setTimeout(()=>$('notice').style.display='none',4500);
}
$('logout').onclick=()=>{player=null;token=null;hud.style.display='none';auth.style.display='flex';setMode('login');$('password').value='';};

function mat(color,roughness=0.9){return new THREE.MeshStandardMaterial({color,roughness});}
function box(parent,w,h,d,x,y,z,material){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function init3D(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbdce);scene.fog=new THREE.Fog(0x9bbdce,55,155);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
 $('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xd8edff,0x625343,2.0));
 const sun=new THREE.DirectionalLight(0xffe3b5,3.1);sun.position.set(-25,40,18);sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;
 sun.shadow.bias=-0.0005;scene.add(sun);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x777c70));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
 const roadMat=mat(0x353a3e),sideMat=mat(0xb0a99a),lineMat=mat(0xd9cda2);
 // Main intersecting roads and pavements
 for(let n=-6;n<=6;n++){
  const pos=n*12;
  const road1=box(scene,5,.06,150,pos,.01,0,roadMat);
  const road2=box(scene,150,.06,5,0,.012,pos,roadMat);
  box(scene,.22,.025,150,pos+2.25,.055,0,lineMat);
  box(scene,150,.025,.22,0,.055,pos+2.25,lineMat);
  box(scene,6,.16,150,pos-3,.02,0,sideMat);
  box(scene,150,.16,6,0,.02,pos-3,sideMat);
 }
 // Rough plots, compound walls, houses and metal roofs
 const walls=[0xc6b99f,0xd7c9b4,0xb7c5bb,0xd1b19a,0xaaaeb0,0xe0d2b7].map(c=>mat(c));
 const roofMats=[0x5b6268,0x76584a,0x474e55].map(c=>mat(c));
 const windowMat=new THREE.MeshStandardMaterial({color:0x315466,roughness:.35,metalness:.15});
 const doorMat=mat(0x49372a),concrete=mat(0xaaa69b);
 for(let x=-60;x<=60;x+=12){
  for(let z=-60;z<=60;z+=12){
   if(Math.abs(x)<9||Math.abs(z)<9)continue;
   const bx=x+(Math.random()-.5)*1.5,bz=z+(Math.random()-.5)*1.5;
   const w=4+Math.random()*2,d=4+Math.random()*2,h=2.8+Math.random()*2.1;
   box(scene,w+.8,.22,d+.8,bx,.14,bz,concrete);
   box(scene,w,h,d,bx,h/2+.25,bz,walls[Math.floor(Math.random()*walls.length)]);
   // Flat concrete roof and parapet, typical urban houses
   box(scene,w+.12,.16,d+.12,bx,h+.25,bz,roofMats[Math.floor(Math.random()*roofMats.length)]);
   box(scene,w,.18,.12,bx,h+.39,bz-d/2,concrete);
   box(scene,w,.18,.12,bx,h+.39,bz+d/2,concrete);
   box(scene,.12,.18,d,bx-w/2,h+.39,bz,concrete);
   box(scene,.12,.18,d,bx+w/2,h+.39,bz,concrete);
   box(scene,.85,1.55,.08,bx-w*.18,1.02,bz+d/2+.045,doorMat);
   for(let wy=1.2;wy<h-.15;wy+=1.25){
    for(let wx=-w/2+.55;wx<w/2-.3;wx+=1.35){
     if(Math.abs(wx)<w*.25&&wy<1.8)continue;
     box(scene,.65,.55,.07,bx+wx,wy+.25,bz+d/2+.05,windowMat);
     box(scene,.72,.07,.09,bx+wx,wy+.25,bz+d/2+.09,concrete);
    }
   }
  }
 }
 // Street trees and simple poles
 const trunk=mat(0x554333),leafMats=[0x416e48,0x527b46,0x3f6341].map(c=>mat(c));
 for(let x=-54;x<=54;x+=12){
  for(let z=-54;z<=54;z+=12){
   if(Math.abs(x)<12||Math.abs(z)<12||Math.random()>.45)continue;
   box(scene,.22,1.7,.22,x,.85,z,trunk);
   const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,1),leafMats[Math.floor(Math.random()*leafMats.length)]);
   crown.position.set(x,2.4,z);crown.castShadow=true;scene.add(crown);
  }
 }
 // Player character: feet at ground level, low body and head properly proportioned
 char=new THREE.Group();scene.add(char);char.position.set(0,0,2);
 const skin=mat(0x875638),shirt=mat(0x276c59),pants=mat(0x252d38),shoe=mat(0x15191e),hair=mat(0x171717);
 // Legs start at ground; no oversized floating torso
 box(char,.28,.82,.3,-.19,.47,0,pants);
 box(char,.28,.82,.3,.19,.47,0,pants);
 box(char,.3,.16,.48,-.19,.09,.07,shoe);
 box(char,.3,.16,.48,.19,.09,.07,shoe);
 box(char,.68,.72,.38,0,1.22,0,shirt);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.235,16,12),skin);
 head.position.set(0,1.77,0);head.castShadow=true;char.add(head);
 const hairMesh=new THREE.Mesh(new THREE.SphereGeometry(.24,16,8,0,Math.PI*2,0,Math.PI*.48),hair);
 hairMesh.position.set(0,1.86,0);hairMesh.castShadow=true;char.add(hairMesh);
 // Arms attached at shoulders
 const armGeo=new THREE.CylinderGeometry(.085,.075,.62,8);
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(armGeo,skin);arm.position.set(side*.42,1.22,0);arm.rotation.z=side*-.12;arm.castShadow=true;char.add(arm);
 }
 const shadow=new THREE.Mesh(new THREE.CircleGeometry(.48,20),new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:.23}));
 shadow.rotation.x=-Math.PI/2;shadow.position.y=.035;char.add(shadow);
 camera.position.set(0,4,9);camera.lookAt(0,1,0);
 window.addEventListener('resize',resize);
 requestAnimationFrame(animate);
}
function resize(){if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function animate(){
 requestAnimationFrame(animate);if(!renderer||!char)return;
 const dt=Math.min(clock.getDelta(),.05);
 const speed=4.0;
 if(Math.abs(joyX)>.04||Math.abs(joyY)>.04){
  const forward=-joyY,right=joyX;
  const dx=(right*Math.cos(camYaw)+forward*Math.sin(camYaw))*speed*dt;
  const dz=(-right*Math.sin(camYaw)+forward*Math.cos(camYaw))*speed*dt;
  char.position.x=clamp(char.position.x+dx,-68,68);
  char.position.z=clamp(char.position.z+dz,-68,68);
  char.rotation.y=Math.atan2(dx,dz);
 }
 // Camera follows at character height instead of looking down from far above
 const distance=6.3;
 camera.position.x=char.position.x+Math.sin(camYaw)*distance;
 camera.position.z=char.position.z+Math.cos(camYaw)*distance;
 camera.position.y=2.9;
 camera.lookAt(char.position.x,1.05,char.position.z);
 renderer.render(scene,camera);
}
// Touch joystick, mouse and pointer support
const joy=$('joy'),stick=$('stick');
function moveJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;const max=37,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joyX=dx/max;joyY=dy/max;
 stick.style.transform='translate('+dx+'px,'+dy+'px)';
}
joy.addEventListener('pointerdown',e=>{draggingJoy=true;joy.setPointerCapture(e.pointerId);moveJoy(e);});
joy.addEventListener('pointermove',e=>{if(draggingJoy)moveJoy(e);});
function stopJoy(){draggingJoy=false;joyX=0;joyY=0;stick.style.transform='translate(0,0)';}
joy.addEventListener('pointerup',stopJoy);joy.addEventListener('pointercancel',stopJoy);
const look=$('look');
look.addEventListener('pointerdown',e=>{lookActive=true;lastLookX=e.clientX;look.setPointerCapture(e.pointerId);});
look.addEventListener('pointermove',e=>{if(!lookActive)return;camYaw-= (e.clientX-lastLookX)*.006;lastLookX=e.clientX;});
look.addEventListener('pointerup',()=>lookActive=false);
look.addEventListener('pointercancel',()=>lookActive=false);
$('action').addEventListener('click',()=>{
 $('notice').style.display='block';
 $('notice').textContent='Explore the city with the joystick. Jobs and missions are coming next!';
 setTimeout(()=>$('notice').style.display='none',3200);
});
</script>
</body>
</html>
