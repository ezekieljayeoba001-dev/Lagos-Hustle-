
<!DOCTYPE html>
<html lang="en">

<title>Lagos Hustle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fc7dc;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

.panel{background:#101b28e8;color:white;border:1px solid #ffffff25;border-radius:14px;padding:10px 13px;box-shadow:0 5px 20px #0002}
.brand{font-weight:900;font-size:17px}
.small{font-size:11px;color:#b7c7d8;margin-top:4px}
#status{font-size:12px;color:#80f0b0;margin-top:4px}
#help{position:fixed;top:88px;left:12px;background:#101b28bd;color:white;padding:8px 11px;border-radius:10px;font-size:11px;pointer-events:none}

#look{position:fixed;right:18px;bottom:160px;color:white;font-size:10px;background:#101b2877;padding:7px 10px;border-radius:10px;pointer-events:none}

#authSubmit{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#16b98c,#2673ed);color:white;font-weight:800;font-size:15px;margin-top:20px;touch-action:manipulation}

<body>
<div id="game"></div>
<div id="loading"><div>LOADING LAGOS HUSTLE<span>Building your city...</span></div></div>

<div id="auth">
  <div class="auth-card">
    <div class="logo">🏙️</div>
    <h1>Lagos Hustle</h1>
    <p>Enter the city. Build your story. Make your hustle count.</p>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>

    <form id="authForm">
      <div id="usernameWrap" style="display:none">
        <label for="username">Player username</label>

<div id="topbar">

</div>
<button id="logout" type="button">Log out</button>

  <div id="joy"><div id="knob"></div></div>

<script type="module">
import * as THREE from 'three';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* PUT YOUR SUPABASE PROJECT URL AND PUBLISHABLE KEY BELOW */
const SUPABASE_URL = 'https://lurfrhnxltjvwtqqjmjd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_CT8e0uz4RNFd2SKTmNFtYQ_nrQVSuZq';

const CONFIGURED = !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
  
const authScreen = document.getElementById('auth');
const authForm = document.getElementById('authForm');
const authMsg = document.getElementById('authMsg');
const authSubmit = document.getElementById('authSubmit');
const usernameWrap = document.getElementById('usernameWrap');
const usernameInput = document.getElementById('username');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginTab = document.getElementById('loginTab');
const signupTab = document.getElementById('signupTab');
const logoutButton = document.getElementById('logout');
let authMode = 'login';
let currentUser = null;
let profile = null;
let profileBusy = false;

function setAuthMode(mode) {
  authMode = mode;
  const signup = mode === 'signup';
  usernameWrap.style.display = signup ? 'block' : 'none';
  usernameInput.required = signup;
  loginTab.classList.toggle('active', !signup);
  signupTab.classList.toggle('active', signup);
  authSubmit.textContent = signup ? 'Create account' : 'Login and enter city';
  passwordInput.autocomplete = signup ? 'new-password' : 'current-password';
  authMsg.textContent = '';
}
loginTab.addEventListener('click', () => setAuthMode('login'));
signupTab.addEventListener('click', () => setAuthMode('signup'));

function friendlyError(error) {
  const text = error?.message || 'Something went wrong. Please try again.';
  if (/invalid login credentials/i.test(text)) return 'Email or password is incorrect.';
  if (/already registered/i.test(text)) return 'This email already has an account. Please log in.';
  if (/email not confirmed/i.test(text)) return 'Please confirm your email using the link we sent you.';
  return text;
}

authForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (!CONFIGURED) {
    authMsg.textContent = 'Add your Supabase Project URL and publishable key in the code first.';
    return;
  }
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  authSubmit.disabled = true;
  authSubmit.textContent = 'Please wait...';
  authMsg.textContent = '';

  try {
    if (authMode === 'signup') {
      const username = usernameInput.value.trim();
      if (username.length < 3) throw new Error('Username must be at least 3 characters.');
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: { data: { username } }
      });
      if (error) throw error;
      if (data.session) {
        await enterGame(data.user, username);
      } else {
        authMsg.textContent = 'Account created! Check your email to confirm it, then return here and log in.';
      }
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enterGame(data.user);
    }
  } catch (error) {
    authMsg.textContent = friendlyError(error);
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent = authMode === 'signup' ? 'Create account' : 'Login and enter city';
  }
});

async function enterGame(user, chosenUsername = '') {
  if (!user) return;
  currentUser = user;
  profileBusy = true;
  authMsg.textContent = 'Loading your player profile...';

  try {
    const { data: existing, error: readError } = await supabase
      .from('Players').select('*').eq('User_id', user.id).maybeSingle();
    if (readError) throw readError;

    if (existing) {
      profile = existing;
      if (chosenUsername && profile.username !== chosenUsername) {
        const { data, error } = await supabase.from('Players')
          .update({ username: chosenUsername })
          .eq('User_id', user.id).select().single();
        if (error) throw error;
        profile = data;
      }
    } else {
      const username = chosenUsername || user.user_metadata?.username ||
                       (user.email ? user.email.split('@')[0] : 'Player');
      const { data, error } = await supabase.from('Players').insert({
        'User_id': user.id,
        username,
        money: 0,
        xp: 0,
        level: 1,
        vehicles: [],
        inventory: []
      }).select().single();
      if (error) throw error;
      profile = data;
    }

    document.getElementById('playerName').textContent = 'Player: ' + profile.username;
    document.getElementById('playerStats').textContent =
      '₦' + Number(profile.money || 0).toLocaleString() +
      ' • Level ' + Number(profile.level || 1);
    authScreen.style.display = 'none';
    logoutButton.style.display = 'block';
    showMessage('Welcome to Lagos Hustle, ' + profile.username + '!');
  } catch (error) {
    authMsg.textContent = 'Signed in, but player profile could not load: ' + friendlyError(error);
    authMsg.textContent += ' Check your Players table columns and RLS policies.';
    authScreen.style.display = 'flex';
  } finally {
    profileBusy = false;
  }
}

logoutButton.addEventListener('click', async () => {
  const { error } = await supabase.auth.signOut();
  if (error) {
    showMessage(friendlyError(error));
    return;
  }
  currentUser = null;
  profile = null;
  logoutButton.style.display = 'none';
  authScreen.style.display = 'flex';
  setAuthMode('login');
  showMessage('You have logged out.');
});

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentUser = null;
    profile = null;
  }
});

function showMessage(text) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(showMessage.timer);
  showMessage.timer = setTimeout(() => el.style.display = 'none', 2600);
}

/* 3D GAME */
const root = document.getElementById('game');
const loading = document.getElementById('loading');
let scene, camera, renderer, player, clock;
let yaw = 0, pitch = 0.25, moveX = 0, moveY = 0;
let running = false, jumping = false, jumpTime = 0, ready = false;
let lastLookX = 0, lastLookY = 0, looking = false;

function showError(text) {
  loading.style.display = 'flex';
  loading.textContent = 'GAME COULD NOT LOAD: ' + text + '. Check your internet connection and reload.';
}

try { init(); animate(); }
catch (error) { console.error(error); showError('Unable to initialize the 3D scene'); }

function material(color, roughness = 0.9) {
  return new THREE.MeshStandardMaterial({ color, roughness });
}
function box(w,h,d,color,x,y,z,parent=scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material(color));
  mesh.position.set(x,y+h/2,z);
  parent.add(mesh);
  return mesh;
}

function createCity() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    material(0x89916b)
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.12;
  scene.add(ground);

  // Main asphalt roads
  box(18, 0.16, 350, 0x292e32, 0, -0.03, 0);
  box(350, 0.16, 18, 0x292e32, 0, -0.02, 0);

  // Road shoulders and concrete sidewalks
  for (const side of [-1, 1]) {
    box(2.5, 0.22, 350, 0xaaa69b, side * 10.2, 0.02, 0);
    box(350, 0.22, 2.5, 0xaaa69b, 0, 0.02, side * 10.2);

    box(1.4, 0.12, 350, 0x777a77, side * 12.15, 0.04, 0);
    box(350, 0.12, 1.4, 0x777a77, 0, 0.04, side * 12.15);
  }

  // Broken yellow road markings
  for (let i = -165; i <= 165; i += 12) {
    box(0.16, 0.025, 5, 0xf4d66c, 0, 0.07, i);
    box(5, 0.025, 0.16, 0xf4d66c, i, 0.07, 0);
  }

  // Road-edge white lines
  for (const side of [-1, 1]) {
    box(0.12, 0.025, 350, 0xe7e4d8, side * 7.8, 0.07, 0);
    box(350, 0.025, 0.12, 0xe7e4d8, 0, 0.07, side * 7.8);
  }

  // Building colors inspired by Lagos streets
  const colors = [
    0xc8b49a, 0xd7c8b2, 0xb6c0c2, 0xe4d6bf,
    0x9eaaa4, 0xc4a58b, 0xb7b5aa, 0xd7b98b,
    0xd4c1a4, 0xaaa69b
  ];

  const windowMat = material(0x78b6d0, 0.35);
  const darkMat = material(0x34383a);
  const roofMat = material(0x77766f);

  // Buildings around the road grid
  for (let x = -130; x <= 130; x += 25) {
    for (let z = -130; z <= 130; z += 25) {
      if (Math.abs(x) < 20 || Math.abs(z) < 20) continue;

      const seed = Math.abs(Math.floor(x * 17 + z * 31));
      const w = 9 + seed % 7;
      const d = 9 + (seed * 3) % 7;
      const h = 7 + (seed * 7) % 25;
      const color = colors[seed % colors.length];

      // Main building body
      box(w, h, d, color, x, h / 2, z);

      // Flat rooftop and small rooftop structures
      box(w + 0.15, 0.25, d + 0.15, roofMat, x, h + 0.08, z);

      if (seed % 3 === 0) {
        box(w * 0.35, 1.5, d * 0.35, color, x, h + 0.9, z);
      }

      // Front windows and dark window frames
      for (let wy = 2; wy < h - 1; wy += 3) {
        for (let wx = -w / 2 + 1.4; wx < w / 2 - 0.5; wx += 2.5) {
          box(
            1.05, 1.35, 0.10,
            darkMat, x + wx, wy, z + d / 2 + 0.06
          );

          box(
            0.84, 1.12, 0.035,
            0x75b4cb, x + wx, wy, z + d / 2 + 0.125
          );
        }
      }

      // Street-facing shopfronts on selected buildings
      if (seed % 2 === 0) {
        box(
          w * 0.48, 1.8, 0.12,
          0x66513d, x, 1.0, z + d / 2 + 0.12
        );
        box(
          w * 0.43, 0.75, 0.04,
          0x3d8791, x, 1.05, z + d / 2 + 0.21
        );
        box(
          w * 0.55, 0.18, 0.8,
          0xb84b36, x, 2.05, z + d / 2 + 0.3
        );
      }

      // Small roadside entrance steps
      box(2.5, 0.18, 1.0, 0xaaa69b, x, 0.12, z + d / 2 + 0.7);
    }
  }

  // Streetlights along the central roads
  for (let p = -70; p <= 70; p += 22) {
    if (p === 0) continue;

    for (const side of [-1, 1]) {
      const lx = side * 11.5;
      const lz = p;

      box(0.18, 4.5, 0.18, 0x44494c, lx, 2.25, lz);
      box(1.0, 0.12, 0.12, 0xe4d4a1, lx + side * 0.4, 4.5, lz);
      box(0.25, 0.16, 0.22, 0xf3d58b, lx + side * 0.82, 4.42, lz);
    }
  }

  // Tropical roadside trees
  function palmTree(x, z, scale = 1) {
    const trunkMat = material(0x755037);
    const leafMat = material(0x347347);

    box(
      0.45 * scale, 3.3 * scale, 0.45 * scale,
      0x755037, x, 1.65 * scale, z
    );

    const crownY = 3.3 * scale;

    // Broad green crown
    const crown = new THREE.Mesh(
      new THREE.SphereGeometry(1.65 * scale, 10, 8),
      leafMat
    );
    crown.position.set(x, crownY, z);
    scene.add(crown);

    // Palm-like fronds
    for (let a = 0; a < 8; a++) {
      const angle = a * Math.PI / 4;
      const frond = new THREE.Mesh(
        new THREE.BoxGeometry(0.28 * scale, 0.12 * scale, 2.3 * scale),
        leafMat
      );

      frond.position.set(
        x + Math.sin(angle) * 0.9 * scale,
        crownY + 0.15 * scale,
        z + Math.cos(angle) * 0.9 * scale
      );

      frond.rotation.y = angle;
      frond.rotation.x = -0.25;
      scene.add(frond);
    }
  }

  // Trees placed beside roads, away from the center
  for (let p = -80; p <= 80; p += 20) {
    if (p === 0) continue;

    for (const side of [-1, 1]) {
      palmTree(side * 15.5, p, 0.8);
      palmTree(p, side * 15.5, 0.7);
    }
  }

  // Small landscaped green area
  box(35, 0.2, 0.5, 0x50614a, 47.5, 0, -37);
}

function createPlayer(){
  player=new THREE.Group();scene.add(player);
  const skin=material(0x8b5938),shirt=material(0x2465b6),trousers=material(0x252d39),shoes=material(0x16191e);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.36,.43,1.05,10),shirt);
  body.position.y=1.25;player.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),skin);
  head.position.y=2.02;player.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.325,12,6,0,Math.PI*2,0,Math.PI*.48),material(0x171512));
  hair.position.y=2.13;player.add(hair);
  const leftLeg=new THREE.Mesh(new THREE.BoxGeometry(.25,.7,.29),trousers);
  leftLeg.position.set(-.19,.43,0);player.add(leftLeg);
  const rightLeg=leftLeg.clone();rightLeg.position.x=.19;player.add(rightLeg);
  const leftArm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.53,3,6),skin);
  leftArm.position.set(-.48,1.28,0);leftArm.rotation.z=-.12;player.add(leftArm);
  const rightArm=leftArm.clone();rightArm.position.x=.48;rightArm.rotation.z=.12;player.add(rightArm);
  const leftShoe=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.42),shoes);
  leftShoe.position.set(-.19,.09,-.06);player.add(leftShoe);
  const rightShoe=leftShoe.clone();rightShoe.position.x=.19;player.add(rightShoe);
  player.userData.legs=[leftLeg,rightLeg];player.userData.arms=[leftArm,rightArm];
  player.position.set(0,0,8);
}
function setupControls(){
  const joy=document.getElementById('joy'),knob=document.getElementById('knob');
  let joyPointer=null;
  function updateJoy(e){
    const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,len=Math.hypot(dx,dy);
    if(len>max){dx*=max/len;dy*=max/len}
    moveX=dx/max;moveY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
  }
  joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateJoy(e)});
  function releaseJoy(e){if(e.pointerId!==joyPointer)return;joyPointer=null;moveX=moveY=0;knob.style.transform='translate(0px,0px)'}
  joy.addEventListener('pointerup',releaseJoy);joy.addEventListener('pointercancel',releaseJoy);
  const runButton=document.getElementById('run');
  runButton.addEventListener('pointerdown',e=>{e.preventDefault();running=true;runButton.classList.add('on')});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>runButton.addEventListener(ev,()=>{running=false;runButton.classList.remove('on')}));
  document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(!jumping){jumping=true;jumpTime=0}});
  renderer.domElement.addEventListener('pointerdown',e=>{
    if(e.clientX<innerWidth*.25||e.clientY>innerHeight*.65)return;
    looking=true;lastLookX=e.clientX;lastLookY=e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(!looking)return;
    const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
    lastLookX=e.clientX;lastLookY=e.clientY;
    yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.15,.8);
  });
  renderer.domElement.addEventListener('pointerup',()=>looking=false);
  renderer.domElement.addEventListener('pointercancel',()=>looking=false);
  const keys={};
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&!jumping){jumping=true;jumpTime=0}});
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  window.getKeyboard=()=>keys;
}
function resize(){
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
}
function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc9df);scene.fog=new THREE.Fog(0x9fc9df,90,260);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
  clock=new THREE.Clock();
  scene.add(new THREE.HemisphereLight(0xdceeff,0x65714d,2));
  const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-50,100,30);scene.add(sun);
  createCity();createPlayer();setupControls();
  camera.position.set(0,5,9);camera.lookAt(player.position);
  addEventListener('resize',resize);ready=true;loading.style.display='none';
}
function animate(){
  requestAnimationFrame(animate);if(!ready)return;
  const dt=Math.min(clock.getDelta(),.04),keys=window.getKeyboard?window.getKeyboard():{};
  let mx=moveX,my=moveY;
  if(keys.w||keys.arrowup)my=-1;if(keys.s||keys.arrowdown)my=1;
  if(keys.a||keys.arrowleft)mx=-1;if(keys.d||keys.arrowright)mx=1;
  const moving=Math.abs(mx)+Math.abs(my)>.12,speed=(running||keys.shift?10:5)*dt;
  if(moving){
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const direction=new THREE.Vector3().addScaledVector(right,mx).addScaledVector(forward,-my);
    if(direction.lengthSq()>0){direction.normalize();player.position.addScaledVector(direction,speed);player.rotation.y=Math.atan2(direction.x,direction.z)}
  }
  if(jumping){jumpTime+=dt;if(jumpTime>.75){jumping=false;jumpTime=0}}
  player.position.y=jumping?Math.sin(jumpTime/.75*Math.PI)*1.5:0;
  const phase=performance.now()*.012;
  player.userData.legs.forEach((leg,i)=>leg.rotation.x=moving?Math.sin(phase+i*Math.PI)*.55:0);
  player.userData.arms.forEach((arm,i)=>arm.rotation.x=moving?Math.sin(phase+i*Math.PI+Math.PI)*.4:0);
  const distance=7,horizontal=Math.cos(pitch)*distance;
  const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*horizontal,player.position.y+3+Math.sin(pitch)*distance,player.position.z+Math.cos(yaw)*horizontal);
  camera.position.lerp(target,1-Math.exp(-5*dt));
  camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);
  player.position.x=THREE.MathUtils.clamp(player.position.x,-175,175);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-175,175);
  renderer.render(scene,camera);
}
</script>
