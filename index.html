<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<title>Lagos Hustle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:white;font-family:Arial,sans-serif;touch-action:none}button,input{font:inherit}button{border:0;color:white;font-weight:bold;cursor:pointer}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#07111c;text-align:center;padding:25px}.loader{max-width:330px}.loader h1{font-size:32px;margin:0 0 10px;color:#42e8a5}.loader p{color:#c3d1df;line-height:1.5}#bar{height:5px;background:#263746;border-radius:10px;overflow:hidden;margin-top:20px}#bar span{display:block;height:100%;width:30%;background:#42e8a5;transition:width .3s}#login{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:linear-gradient(#06101ac9,#06101af2);padding:25px}.panel{width:min(360px,100%);padding:25px;background:#111f2d;border:1px solid #304455;border-radius:22px;text-align:center}.panel h1{font-size:30px;margin:0 0 8px;color:#42e8a5}.panel p{color:#bdcbd8;line-height:1.5}input{width:100%;padding:14px;border-radius:12px;border:1px solid #43576a;background:#07111c;color:white;margin:12px 0}.primary{width:100%;padding:14px;background:#42e8a5;color:#07111c;border-radius:12px}#hud{display:none;position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.hudbox{background:#07111cce;border:1px solid #34495a;border-radius:13px;padding:10px 13px;backdrop-filter:blur(8px)}#cash{color:#42e8a5;font-size:18px;font-weight:bold}#playername{font-size:12px;color:#c6d5e2;margin-top:4px}#phone{pointer-events:auto;background:#132638;border:1px solid #52677a;border-radius:14px;padding:12px}#hint{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#07111ccc;padding:9px 14px;border-radius:12px;font-size:12px;white-space:nowrap;color:#e0eaf2}#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);height:150px;pointer-events:none}#joy{position:absolute;left:22px;bottom:0;width:124px;height:124px;border-radius:50%;background:#ffffff1b;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}#stick{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:#dce9f1dd;border:2px solid white;box-shadow:0 4px 15px #0008}.actions{position:absolute;right:17px;bottom:0;display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.action{width:65px;height:65px;border-radius:50%;background:#142b3be8;border:2px solid #ffffff65;box-shadow:0 4px 12px #0005;font-size:12px}.action.run{background:#42e8a5;color:#07111c}.action.job{width:57px;height:57px;background:#f3bd4f;color:#18202a}#phonepanel{display:none;position:absolute;right:12px;top:80px;width:220px;background:#102232;border:1px solid #43586b;border-radius:18px;padding:14px;pointer-events:auto}#phonepanel h3{margin:4px 0 12px}.menuBtn{width:100%;padding:12px;margin:4px 0;background:#20384b;border-radius:10px;text-align:left}#toast{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);background:#07111ce8;border:1px solid #42e8a5;padding:11px 15px;border-radius:12px;white-space:nowrap;display:none;font-size:13px}#pause{display:none;position:fixed;inset:0;z-index:15;background:#06101acc;align-items:center;justify-content:center;padding:20px}.small{font-size:12px;color:#a9bdcc}@media(min-width:700px){#joy{left:35px}.actions{right:35px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="loader"><h1>🌆 LAGOS HUSTLE</h1><p id="loadmsg">Building the city...</p><div id="bar"><span></span></div></div></div>
<div id="login"><div class="panel"><h1>LAGOS HUSTLE</h1><p>Welcome to the city. Create your character and start your hustle.</p><input id="nameinput" maxlength="16" placeholder="Enter your player name"><button class="primary" id="start">ENTER CITY</button><p class="small">Explore • Work • Earn • Hustle</p></div></div>
<div id="hud"><div id="top"><div class="hudbox"><div id="cash">₦0</div><div id="playername">Player</div></div><button id="phone">📱 MENU</button></div><div id="hint">Drag the screen to rotate the camera</div><div id="phonepanel"><h3>📱 Player Menu</h3><button class="menuBtn" id="jobmenu">💼 Find a job</button><button class="menuBtn" id="statusmenu">👤 Player status</button><button class="menuBtn" id="pausemenu">⏸️ Pause game</button><button class="menuBtn" id="closemenu">✖ Close menu</button></div><div id="controls"><div id="joy"><div id="stick"></div></div><div class="actions"><button class="action job" id="job">JOB<br>+₦500</button><button class="action" id="jump">JUMP</button><button class="action run" id="run">RUN</button></div></div><div id="toast"></div></div>
<div id="pause"><div class="panel"><h1>PAUSED</h1><p>Your Lagos adventure is waiting.</p><button class="primary" id="resume">CONTINUE</button></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
const $ = id => document.getElementById(id);
const game = $("game");
let scene,camera,renderer,player,robot;
let moveX=0,moveY=0,running=false,jumping=false,paused=false,money=0;
let playerName="Player",verticalSpeed=0,cameraYaw=0,cameraPitch=0.32,cameraDistance=7,toastTimer;
let robotParts={arms:[],legs:[]};
const clock=new THREE.Clock();
function showToast(message){$("toast").textContent=message;$("toast").style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").style.display="none",2400)}
function updateMoney(){$("cash").textContent="₦"+money.toLocaleString("en-NG")}
function makeMaterial(color,roughness=.72,metalness=.2){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function addBox(x,y,z,sx,sy,sz,material,parent=scene,rx=0,ry=0,rz=0){const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);mesh.position.set(x,y,z);mesh.rotation.set(rx,ry,rz);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function addSphere(x,y,z,sx,sy,sz,material,parent){const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),material);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function createCity(){scene.background=new THREE.Color(0x8bb8d4);scene.fog=new THREE.Fog(0x8bb8d4,65,180);scene.add(new THREE.HemisphereLight(0xc9e7ff,0x55503e,2.1));const sun=new THREE.DirectionalLight(0xfff0d2,3);sun.position.set(-30,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),makeMaterial(0x697e62,1,0));ground.rotation.x=-Math.PI/2;ground.position.y=-.06;ground.receiveShadow=true;scene.add(ground);
addBox(0,.015,0,15,.04,220,makeMaterial(0x30383d,1,0));addBox(0,.02,0,220,.04,13,makeMaterial(0x30383d,1,0));const roadLine=makeMaterial(0xf5d76b,1,0);for(let z=-100;z<=100;z+=8)addBox(0,.05,z,.22,.025,3.5,roadLine);for(let x=-100;x<=100;x+=8)addBox(x,.05,0,3.5,.025,.22,roadLine);
const buildingColors=[0xc5a58a,0xd4d0c0,0x8d9eaa,0xb5b5a2,0xc28e70,0x87958d,0xd0bd93];for(let x=-48;x<=48;x+=12){for(let z=-48;z<=48;z+=12){if(Math.abs(x)<13||Math.abs(z)<13)continue;const height=5+Math.random()*17,width=6+Math.random()*2,depth=6+Math.random()*2,color=buildingColors[Math.floor(Math.random()*buildingColors.length)];addBox(x+(Math.random()-.5)*2,height/2,z+(Math.random()-.5)*2,width,height,depth,makeMaterial(color));if(height>13)addBox(x,height+.4,z,2,.8,2,makeMaterial(0x6c777d));const windowMat=makeMaterial(0x294c61,.35,.1);for(let wy=2;wy<height-1;wy+=3)for(let wx=-2;wx<=2;wx+=2)addBox(x+wx,wy,z+depth/2+.035,.85,1.1,.07,windowMat);}}
const poleMat=makeMaterial(0x414b50),lampMat=makeMaterial(0xf5e3a0);for(let z=-40;z<=40;z+=20)for(const x of [-10,10]){addBox(x,2,z,.16,4,.16,poleMat);addBox(x,4.05,z,.9,.12,.35,lampMat)}addBox(-19,1.7,-8,8,3.4,6,makeMaterial(0xd0a16b));addBox(-19,3.6,-8,9,.35,7,makeMaterial(0x246b82));addBox(-19,1.25,-4.92,3.8,1.8,.12,makeMaterial(0x294858));}
// Build the robot directly in the game; no separate GLB file is needed.
function createRoboCopCharacter(){const g=new THREE.Group();const silver=makeMaterial(0x9eabb6,.34,.82),lightSilver=makeMaterial(0xd6e0e7,.3,.72),dark=makeMaterial(0x17232d,.55,.55),black=makeMaterial(0x070c12,.28,.35),blue=makeMaterial(0x163e68,.3,.7),visor=makeMaterial(0x101b28,.16,.8),glow= new THREE.MeshStandardMaterial({color:0x53dfff,emissive:0x147da8,emissiveIntensity:1.5,metalness:.6,roughness:.2}),joint=makeMaterial(0x37444e,.42,.7);
// Feet, shins and knees
for(const side of [-1,1]){const leg=new THREE.Group();leg.position.set(side*.22,.9,0);g.add(leg);addBox(0,-.36,.04,.28,.68,.32,silver,leg);addBox(0,-.13,.205,.22,.2,.08,lightSilver,leg);addBox(0,-.02,.02,.3,.13,.34,dark,leg);addBox(0,-.72,.11,.38,.16,.55,black,leg);addBox(0,-.65,.15,.31,.055,.4,blue,leg);addSphere(0,.02,0,.14,.14,.14,joint,leg);robotParts.legs.push(leg);}
// Pelvis and segmented torso
addBox(0,1.02,0,.64,.3,.4,dark,g);addBox(0,1.17,.025,.62,.2,.43,silver,g);addBox(0,1.38,0,.72,.43,.42,silver,g);addBox(0,1.42,.225,.58,.27,.055,lightSilver,g);addBox(0,1.43,.263,.24,.09,.025,blue,g);addBox(0,1.15,.23,.28,.07,.035,black,g);addBox(0,1.67,0,.42,.13,.34,dark,g);
// Chest armor panels
addBox(-.19,1.49,.252,.25,.24,.06,lightSilver,g,0,0,-.08);addBox(.19,1.49,.252,.25,.24,.06,lightSilver,g,0,0,.08);addBox(0,1.54,.29,.1,.22,.045,blue,g);addBox(0,1.34,.25,.34,.07,.05,dark,g);
// Helmet and dark visor
addBox(0,1.91,0,.48,.43,.4,silver,g);addBox(0,2.1,.015,.5,.16,.42,lightSilver,g);addBox(0,1.97,.22,.43,.13,.045,visor,g);addBox(0,1.97,.25,.31,.025,.018,glow,g);addBox(-.255,1.94,0,.055,.26,.32,blue,g);addBox(.255,1.94,0,.055,.26,.32,blue,g);addBox(0,1.72,.08,.27,.1,.26,dark,g);addBox(0,1.72,.22,.17,.035,.035,lightSilver,g);
// Shoulders, upper arms, forearms and hands
for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.49,1.59,0);g.add(arm);addSphere(0,0,0,.19,.2,.2,blue,arm);addBox(0,-.17,0,.23,.34,.25,silver,arm,0,0,side*-.08);addBox(0,-.2,.135,.16,.19,.045,lightSilver,arm);addSphere(0,-.38,0,.115,.12,.12,joint,arm);addBox(0,-.52,.015,.19,.31,.2,dark,arm,0,0,side*.04);addBox(0,-.53,.125,.14,.2,.04,silver,arm);addBox(0,-.72,.02,.17,.16,.18,lightSilver,arm);addBox(0,-.78,.04,.13,.06,.13,black,arm);robotParts.arms.push(arm);}
// Small back pack and armor details
addBox(0,1.47,-.25,.42,.45,.18,dark,g);addBox(-.13,1.48,-.35,.1,.3,.04,blue,g);addBox(.13,1.48,-.35,.1,.3,.04,blue,g);for(const y of [1.3,1.38,1.46])addBox(0,y,.284,.22,.025,.025,black,g);
return g;}
function createPlayerRoot(){player=new THREE.Group();player.position.set(0,0,8);scene.add(player);robot=createRoboCopCharacter();player.add(robot);player.userData.robot=robot;}
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(65,window.innerWidth/window.innerHeight,.1,400);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.7));renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;game.appendChild(renderer.domElement);createCity();createPlayerRoot();setupControls();$("loadmsg").textContent="RoboCop ready! Finishing the city...";$("bar").firstElementChild.style.width="100%";setTimeout(showLogin,650);updateCamera();animate();window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});}
function updateCamera(){if(!player||!camera)return;const horizontal=Math.cos(cameraPitch)*cameraDistance;camera.position.set(player.position.x+Math.sin(cameraYaw)*horizontal,player.position.y+1.5+Math.sin(cameraPitch)*cameraDistance,player.position.z+Math.cos(cameraYaw)*horizontal);camera.lookAt(player.position.x,player.position.y+1.15,player.position.z)}
function animate(){requestAnimationFrame(animate);const delta=Math.min(clock.getDelta(),.05);if(!paused&&player){const moving=Math.abs(moveX)+Math.abs(moveY)>.12;const speed=running?8:4.3;if(moving){const dx=moveX*Math.cos(cameraYaw)-moveY*Math.sin(cameraYaw),dz=moveX*Math.sin(cameraYaw)+moveY*Math.cos(cameraYaw),length=Math.hypot(dx,dz)||1,nx=dx/length,nz=dz/length;player.position.x+=nx*speed*delta;player.position.z+=nz*speed*delta;player.rotation.y=Math.atan2(nx,nz)}player.position.x=THREE.MathUtils.clamp(player.position.x,-95,95);player.position.z=THREE.MathUtils.clamp(player.position.z,-95,95);if(jumping){player.position.y+=verticalSpeed*delta;verticalSpeed-=18*delta;if(player.position.y<=0){player.position.y=0;jumping=false;verticalSpeed=0}}const swing=moving?Math.sin(performance.now()*.012*(running?1.7:1))*.42:0;robotParts.legs[0].rotation.x=swing;robotParts.legs[1].rotation.x=-swing;robotParts.arms[0].rotation.x=-swing*.65;robotParts.arms[1].rotation.x=swing*.65;if(jumping){robotParts.arms[0].rotation.x=-.8;robotParts.arms[1].rotation.x=-.8}}updateCamera();renderer.render(scene,camera)}
function showLogin(){$("loading").style.display="none";$("login").style.display="flex"}
function enterGame(){playerName=$("nameinput").value.trim()||"Player";$("playername").textContent="👤 "+playerName;$("login").style.display="none";$("hud").style.display="block";showToast("Welcome to Lagos, "+playerName+"!")}
function setupControls(){$("start").addEventListener("click",enterGame);$("nameinput").addEventListener("keydown",e=>{if(e.key==="Enter")enterGame()});const joy=$("joy"),stick=$("stick");let joyPointer=null;function moveStick(e){const rect=joy.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=37,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=-dy/max}joy.addEventListener("pointerdown",e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveStick(e)});joy.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer)moveStick(e)});function releaseJoy(e){if(e.pointerId!==joyPointer)return;joyPointer=null;moveX=moveY=0;stick.style.transform="translate(0,0)"}joy.addEventListener("pointerup",releaseJoy);joy.addEventListener("pointercancel",releaseJoy);
let dragPointer=null,previousX=0,previousY=0;renderer.domElement.addEventListener("pointerdown",e=>{dragPointer=e.pointerId;previousX=e.clientX;previousY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener("pointermove",e=>{if(e.pointerId!==dragPointer||paused)return;const dx=e.clientX-previousX,dy=e.clientY-previousY;previousX=e.clientX;previousY=e.clientY;cameraYaw-=dx*.006;cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.004,.05,.9)});const releaseDrag=e=>{if(e.pointerId===dragPointer)dragPointer=null};renderer.domElement.addEventListener("pointerup",releaseDrag);renderer.domElement.addEventListener("pointercancel",releaseDrag);
$("run").addEventListener("pointerdown",e=>{e.preventDefault();running=true});["pointerup","pointercancel","pointerleave"].forEach(type=>$("run").addEventListener(type,()=>running=false));$("jump").addEventListener("click",()=>{if(player&&!jumping&&!paused){jumping=true;verticalSpeed=7.5}});$("job").addEventListener("click",doJob);$("jobmenu").addEventListener("click",doJob);$("phone").addEventListener("click",()=>{const panel=$("phonepanel");panel.style.display=panel.style.display==="block"?"none":"block"});$("closemenu").addEventListener("click",()=>$("phonepanel").style.display="none");$("statusmenu").addEventListener("click",()=>showToast(playerName+" • ₦"+money.toLocaleString("en-NG")));$("pausemenu").addEventListener("click",pauseGame);$("resume").addEventListener("click",resumeGame)}
function doJob(){if(paused)return;money+=500;updateMoney();showToast("Job completed! You earned ₦500 💰")}
function pauseGame(){paused=true;$("phonepanel").style.display="none";$("pause").style.display="flex"}
function resumeGame(){paused=false;$("pause").style.display="none"}
try{init()}catch(error){console.error(error);$("loadmsg").textContent="The game could not start. Please reload and check the code."}
</script>
</body>
</html>
